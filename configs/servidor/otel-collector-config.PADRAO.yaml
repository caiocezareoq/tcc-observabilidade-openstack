# CONFIGURAÇÃO PADRÃO do Gateway (rodada padrão, seção 4.5/4.6)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métricas do próprio host AWS (CPU, memória, disco, rede) onde roda o
  # Servidor de Observabilidade — para o Dashboard 2 (saúde da infra).
  hostmetrics:
    collection_interval: 15s
    root_path: /hostfs
    scrapers:
      cpu:
      memory:
      disk:
      network:
      load:
      filesystem:

processors:
  batch:
    send_batch_size: 1000
    send_batch_max_size: 2000
    timeout: 5s

exporters:
  # Traces -> Jaeger via OTLP
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Métricas encaminhadas pelo agente local (OpenStack) -> expostas em /metrics
  prometheus:
    endpoint: 0.0.0.0:8889

  # Métricas do próprio host AWS -> endpoint SEPARADO
  prometheus/gateway_host:
    endpoint: 0.0.0.0:8890

  # Logs -> Loki (endpoint nativo OTLP), sem compressão
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]          # sem amostragem: 100% dos traces
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]

    metrics/gateway_host:
      receivers: [hostmetrics]
      processors: [batch]
      exporters: [prometheus/gateway_host, debug]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]

  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
